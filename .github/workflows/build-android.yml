name: Build SecretPlay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Run Dart Analyzer
        working-directory: android_app
        run: dart analyze

      - name: Run Flutter Unit & Cryptographic Tests
        working-directory: android_app
        run: flutter test

      - name: Build Android Release APK (arm64 & armeabi-v7a)
        working-directory: android_app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Upload Compiled Android Release APK (arm64 - Recommended for Phones)
        uses: actions/upload-artifact@v4
        with:
          name: SecretPlay-Release-ARM64-APK
          path: android_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Compiled Android Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SecretPlay-Release-Universal-APK
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release v1.0.0 with Direct APK Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 \
            android_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            android_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            android_app/build/app/outputs/flutter-apk/app-release.apk \
            --title "SecretPlay v1.0.0 (Android APK)" \
            --notes "SecretPlay Encrypted Dual-Persona 2-Device Android Application (Cloudflare Free-Tier + Local Server + 4-Digit PIN + Shared Token Auto-Pairing)"
