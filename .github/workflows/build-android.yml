name: Build SecretPlay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Run Dart Analyzer
        working-directory: android_app
        run: dart analyze

      - name: Run Flutter Unit & Cryptographic Tests
        working-directory: android_app
        run: flutter test

      - name: Build Android Debug APK
        working-directory: android_app
        run: flutter build apk --debug

      - name: Build Android Release APK
        working-directory: android_app
        run: flutter build apk --release

      - name: Upload Compiled Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: SecretPlay-Android-APK
          path: |
            android_app/build/app/outputs/flutter-apk/app-debug.apk
            android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
