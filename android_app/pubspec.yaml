name: secretplay
description: "SecretPlay - Private Dual-Persona Two-Device Encrypted Application"
publish_to: "none"
version: 1.6.0+7

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  cryptography: ^2.7.0
  flutter_webrtc: ^0.11.6+hotfix.1
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  web_socket_channel: ^3.0.0
  uuid: ^4.4.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  web: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
